context:
  version: "9.0.1"

package:
  name: rqbit
  version: ${{ version }}

source:
  url: https://github.com/ikatson/rqbit/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 62a42c56259b737eea6580b63061589dc9940b145c40991cfff83470aa783291

build:
  number: 2
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: ${{ "1" if win else "0" }} # force CMake builder for `aws-lc-sys` native C/C++ code on Windows
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd crates/rqbit
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # bundle licenses from webui assets
      - cd ../../crates/librqbit/webui
      - pnpm install --ignore-scripts
      - pnpm-licenses generate-disclaimer --prod --output-file=../../../THIRDPARTY-webui.txt
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = $prefix | path join bin/rqbit
          - ^$bin completions bash | save ($prefix | path join share/bash-completion/completions/rqbit)
          - ^$bin completions fish | save ($prefix | path join share/fish/vendor_completions.d/rqbit.fish)
          - ^$bin completions zsh  | save ($prefix | path join share/zsh/site-functions/_rqbit)

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - nodejs
    - nushell
    - pkg-config
    - pnpm
    - pnpm-licenses
  host:
    - if: linux
      then: openssl

tests:
  - script:
      - rqbit --help
      - rqbit --version
  - package_contents:
      bin:
        - rqbit
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/rqbit
            - share/fish/vendor_completions.d/rqbit.fish
            - share/zsh/site-functions/_rqbit
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/rqbit
            - Library/share/fish/vendor_completions.d/rqbit.fish
            - Library/share/zsh/site-functions/_rqbit
      strict: true

about:
  summary: A bittorrent client with a CLI, server mode, and Web UI
  description: |
    rqbit is a bittorrent client written in Rust. It offers a command-line interface
    for downloading, sharing, and managing torrents, plus an HTTP API and Web UI.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    - THIRDPARTY-webui.txt
  homepage: https://github.com/ikatson/rqbit
  repository: https://github.com/ikatson/rqbit

extra:
  recipe-maintainers:
    - salim-b
